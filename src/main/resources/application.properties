server.port=8080
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/dsp-backend}

spring.application.name=dsp-backend

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS — override with DSP_CORS_ALLOWED_ORIGINS in the environment/Docker
dsp.cors.allowed-origins=${DSP_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost/dsp,http://localhost:5173}

# Installation configuration (labels, screens, KPIs) — external JSON, similar to the Consulta Pública layerConfig style
# Examples: classpath:installationConfig.json  |  file:/etc/dsp/installationConfig.json  |  /etc/dsp/installationConfig.json
dsp.installation-config.file=${DSP_INSTALLATION_CONFIG_FILE:classpath:installationConfig.json}

# Map basemaps + WMS layers
# Examples: classpath:baseMapConfig.json  |  file:/etc/dsp/baseMapConfig.json
dsp.map.base-maps-file=${DSP_MAP_BASE_MAPS_FILE:classpath:baseMapConfig.json}
dsp.map.layers-file=${DSP_MAP_LAYERS_FILE:classpath:mapLayersConfig.json}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dsp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=dsp
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java